name: CI

on:
  push:
    branches: [live]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # The full engines range (>=20) on Linux, plus one current-LTS job on
        # each other OS — the CLI writes files, resolves paths, and spawns a
        # server, all of which are platform-sensitive.
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    env:
      # The local-client vite build (it bundles a self-hosted Monaco) needs
      # more heap than Node's default on the 7 GB macOS runners.
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: jbook
        # bash everywhere, including Windows: the build steps and the smoke
        # script are written for it.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: jbook/package-lock.json

      - name: Install
        run: npm ci

      - name: Build local-api
        run: npx tsc
        working-directory: jbook/packages/local-api

      - name: Build local-client
        run: npm run build
        working-directory: jbook/packages/local-client

      - name: Bundle cli
        run: npx esbuild src/index.ts --platform=node --outfile=dist/index.js --bundle --minify --define:process.env.NODE_ENV=\"production\"
        working-directory: jbook/packages/cli

      - name: Test
        run: npm test

      # Packs the packages and installs the cli from the tarballs in a scratch
      # project, then runs it — catches packaging bugs (missing dist files,
      # runtime deps declared as devDependencies) that unit tests can't see.
      - name: Pack & install smoke test
        run: ./scripts/pack-smoke.sh
