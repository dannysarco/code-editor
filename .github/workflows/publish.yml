name: Publish

# Publishes every package whose version isn't on the registry yet, with npm
# provenance attestations. Runs when a release tag is pushed (the release
# flow: merge the release-prep PR, then push the vX.Y.Z tag), or manually.
#
# Auth is npm "trusted publishing" (OIDC): each package on npmjs.com is
# configured to trust this repo + workflow file, so no npm token is stored in
# the repo and the user's 2FA stays untouched. Provenance requires the OIDC
# id-token permission below.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url: setting it makes setup-node write an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN}, and the presence of a
      # (empty) token makes npm skip the OIDC trusted-publishing exchange —
      # the publish then fails with a masked E404. With no token configured,
      # npm detects the Actions OIDC environment and exchanges automatically.
      #
      # Deliberately no dependency caching either: this job holds id-token
      # write for trusted publishing, and a poisoned npm cache could run
      # attacker-controlled code with access to the OIDC token (per the
      # setup-node trusted-publishing docs). Publish runs are rare, so the
      # full npm ci is a fine trade.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange —
      # pinned to 11 because npm 12.0.x fails the exchange with "OIDC token
      # exchange error - package not found" (verified: 12.0.2 fails, 11
      # publishes; this is what broke the first v3.7.1 pipeline runs).
      # Revisit the pin when npm 12 fixes the regression.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci
        working-directory: jbook

      - name: Test
        run: npm test
        working-directory: jbook

      # The cli bundle resolves @my-scrapbook/local-api through the workspace
      # symlink to its dist output. When local-api itself is skipped (already
      # published), its prepublishOnly never runs — so build it explicitly or
      # the cli's esbuild step fails with "could not resolve". (types builds
      # via its prepare script during npm ci.)
      - name: Build workspace dependencies
        run: npx tsc
        working-directory: jbook/packages/local-api

      # Dependency order: types -> local-api -> local-client -> cli. Each
      # package's prepublishOnly script builds it. Versions already on the
      # registry are skipped, so a release that bumps only some packages
      # publishes only those.
      - name: Publish packages with provenance
        run: |
          for dir in types local-api local-client cli; do
            pkg="jbook/packages/$dir"
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on the registry — skipping"
            else
              echo "Publishing $name@$version"
              (cd "$pkg" && npm publish --provenance)
            fi
          done
