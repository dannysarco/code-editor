<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2f2" />
    <meta
      name="description"
      content="My Scrapbook — an interactive JavaScript/TypeScript notebook. Write code and markdown side by side; bundling, previews, and npm imports all run in your browser."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>My ScrapBook</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Set the theme before first paint so a dark-theme reload never
         flashes light. Mirrors initialTheme() in src/theme-context.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('scrapbook.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <!-- @babel/traverse reads process.env at module evaluation. The
         production build replaces it statically; the Vite dev server does
         not transform bare `process` references in dependencies. -->
    <script>
      window.process = window.process || { env: {} };
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
